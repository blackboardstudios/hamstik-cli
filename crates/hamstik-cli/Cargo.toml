[package]
name = "hamstik-cli"
description = "Official command-line interface for Hamstik"
publish = false

version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

# Release builds of the `hamstik` binary are produced by cargo-dist
# (see dist-workspace.toml and design/RELEASE.md). The crates themselves are
# not published to crates.io; dist needs this marker to treat the bin as
# releaseable despite `publish = false`.
[package.metadata.dist]
dist = true

[[bin]]
name = "hamstik"
path = "src/main.rs"

[lib]
name = "hamstik_cli"
path = "src/lib.rs"

[dependencies]
clap = { workspace = true }
clap_complete = { workspace = true }
directories = { workspace = true }
hamstik-api-client = { path = "../hamstik-api-client" }
keyring = { workspace = true }
rpassword = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true }
humantime = { workspace = true }
chrono = { workspace = true }
zip = { workspace = true }

# JSON query support for --jq (embedded Rust implementation of jq filter language).
# Only the jq/JSON standard library is enabled; the multi-format readers and
# writers are unnecessary because the CLI already owns JSON serialization.
jaq-all = { version = "0.3", default-features = false, features = ["std-all"] }

# Byte string handling for jaq integration.
bytes = { workspace = true }

# Credential store backends. `keyring` ships NO default features: with no
# backend feature enabled it silently resolves to its in-process mock store,
# where writes "succeed" but vanish when the process exits. Each supported
# platform MUST enable its native store (SPEC §25).
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }

# Linux/BSD: Secret Service over D-Bus. Pure Rust (zbus + rustls crypto) so the
# CLI stays buildable without system D-Bus/OpenSSL headers.
[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd"))'.dependencies]
keyring = { workspace = true, features = [
    "async-secret-service",
    "crypto-rust",
    "tokio",
] }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
wiremock = { workspace = true }

# Lints: the workspace baseline (unsafe forbidden, docs required) plus this
# crate's overrides. Tests assert with unwrap/expect by design, so those two
# stay as warnings that non-test code must keep clean.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
