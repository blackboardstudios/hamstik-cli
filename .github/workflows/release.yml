#
# CI that:
#
# * checks for a Git Tag that looks like a release
# * builds artifacts with dist (archives, installers, hashes)
# * uploads those artifacts to temporary workflow zip
# * on success, uploads the artifacts to a GitHub Release
#
# Note that the GitHub Release will be created with a generated
# title/body based on your changelogs.
#
# HAMSTIK MAINTENANCE NOTE — this file is `dist generate` output plus the
# deliberate, locally maintained modifications below (see design/RELEASE.md,
# §"Regenerating the release workflow"). Because `allow-dirty = ["ci"]` is
# set in dist-workspace.toml, dist will not regenerate or freshness-check
# this file; after a cargo-dist upgrade run `dist generate` (with
# `allow-dirty` removed) and re-apply:
#
# 1. This maintenance note.
# 2. Tag trigger narrowed to `v[0-9]+.[0-9]+.[0-9]+*` (VERSIONING.md §9 tag
#    policy) instead of dist's looser `**[0-9]+.[0-9]+.[0-9]+*`.
# 3. Least-privilege token permissions: top-level `contents: read`, with
#    `contents: write` granted only to the jobs that create/publish the
#    release (plan, host) and `actions: write` to jobs that upload/download
#    workflow artifacts; the Homebrew publish job uses
#    `secrets.HOMEBREW_TAP_TOKEN` for its cross-repo checkout.
# 4. Release gate steps in the `plan` job: `cargo run -p release-gate`
#    fails the workflow before the release announcement is created or any
#    artifact is built when the tag, the workspace version, and
#    CHANGELOG.md disagree.
# 5. Artifact smoke-test step in `build-local-artifacts` running
#    scripts/release_smoke.py against every archive the job produced.
# 6. Supply-chain steps: CycloneDX SBOM generation in
#    `build-global-artifacts`; in `host`, fail-closed per-artifact
#    checksum verification + Sigstore build-provenance attestations +
#    local bundle verification BEFORE publication. The host job also
#    carries `id-token: write` / `attestations: write`.
# 7. Homebrew publish job hardening: neutral commit identity, a loud skip
#    when `HOMEBREW_TAP_TOKEN` is unprovisioned, a nested-formula hoist
#    step, and a no-commit guard on re-runs.
# 8. Winget manifests generated in `build-global-artifacts` for stable
#    releases and excluded from release assets (committed to this repo;
#    PR'd to microsoft/winget-pkgs by a maintainer).

name: Release
# Hamstik modification: least-privilege baseline; jobs that need to
# create the release or move artifacts opt in to the required scopes below.
permissions:
  contents: read

# This task will run whenever you push a git tag that looks like a version
# like "1.0.0", "v0.1.0-prerelease.1", "my-app/0.1.0", "releases/v1.0.0", etc.
# Various formats will be parsed into a VERSION and an optional PACKAGE_NAME, where
# PACKAGE_NAME must be the name of a Cargo package in your workspace, and VERSION
# must be a Cargo-style SemVer Version (must have at least major.minor.patch).
#
# If PACKAGE_NAME is specified, then the announcement will be for that
# package (erroring out if it doesn't have the given version or isn't dist-able).
#
# If PACKAGE_NAME isn't specified, then the announcement will be for all
# (dist-able) packages in the workspace with that version (this mode is
# intended for workspaces with only one dist-able package, or with all dist-able
# packages versioned/released in lockstep).
#
# If you push multiple tags at once, separate instances of this workflow will
# spin up, creating an independent announcement for each one. However, GitHub
# will hard limit this to 3 tags per commit, as it will assume more tags is a
# mistake.
#
# If there's a prerelease-style suffix to the version, then the release(s)
# will be marked as a prerelease.
on:
  pull_request:
  push:
    # Hamstik modification: only version tags per VERSIONING.md §9.
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  # Run 'dist plan' (or host) to determine what tasks we need to do
  plan:
    runs-on: "ubuntu-22.04"
    # Hamstik modification: this job needs `contents: write` only because on
    # a tag push it creates the release announcement via
    # `dist host --steps=create`; `actions: write` covers the manifest/cache
    # artifact uploads below.
    permissions:
      contents: write
      actions: write
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ !github.event.pull_request && github.ref_name || '' }}
      tag-flag: ${{ !github.event.pull_request && format('--tag={0}', github.ref_name) || '' }}
      publishing: ${{ !github.event.pull_request }}
      # Hamstik addition: whether the Homebrew tap token is provisioned; the
      # publish job skips (with a loud note) when absent.
      homebrew_tap_token_present: ${{ steps.tap_token.outputs.present }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      # Hamstik addition: fail closed on version/tag inconsistency before
      # the release announcement is created or anything is built. The gate
      # enforces design/VERSIONING.md §1/§8/§9: a `vX.Y.Z` tag must equal
      # the workspace Cargo.toml version and the matching CHANGELOG.md
      # release section. `release-gate` is a dependency-free crate, so this
      # compiles in seconds.
      - name: Install Rust toolchain for the release gate
        if: ${{ !github.event.pull_request }}
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Release gate (tag/version/changelog consistency)
        if: ${{ !github.event.pull_request }}
        run: cargo run --locked -p release-gate -- --tag "$GITHUB_REF_NAME"
      # Hamstik addition: surface only the PRESENCE of the tap token for the
      # publish job's skip logic. GitHub masks the secret value; this step
      # never prints it.
      - id: tap_token
        name: Check Homebrew tap token presence
        run: |
          if [ -n "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Install dist
        # we specify bash to get pipefail; it guards against the `curl` command
        # failing. otherwise `sh` won't catch that `curl` returned non-0
        shell: bash
        run: "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh"
      - name: Cache dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist
      # sure would be cool if github gave us proper conditionals...
      # so here's a doubly-nested ternary-via-truthiness to try to provide the best possible
      # functionality based on whether this is a pull_request, and whether it's from a fork.
      # (PRs run on the *source* but secrets are usually on the *target* -- that's *good*
      # but also really annoying to build CI around when it needs secrets to work right.)
      - id: plan
        run: |
          dist ${{ (!github.event.pull_request && format('host --steps=create --tag={0}', github.ref_name)) || 'plan' }} --output-format=json > plan-dist-manifest.json
          echo "dist ran successfully"
          cat plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  # Build and packages all the platform-specific things
  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    # Let the initial task tell us to not run (currently very blunt)
    needs:
      - plan
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null && (needs.plan.outputs.publishing == 'true' || fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload') }}
    # Hamstik modification: artifact upload/download only needs the
    # `actions` scope; no repository write access is granted here.
    permissions:
      actions: write
    strategy:
      fail-fast: false
      # Target platforms/runners are computed by dist in create-release.
      # Each member of the matrix has the following arguments:
      #
      # - runner: the github runner
      # - dist-args: cli flags to pass to dist
      # - install-dist: expression to run to install dist on the runner
      #
      # Typically there will be:
      # - 1 "global" task that builds universal installers
      # - N "local" tasks that build each platform's binaries and platform-specific installers
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container && matrix.container.image || null }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    steps:
      - name: enable windows longpaths
        run: |
          git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Rust non-interactively if not already installed
        if: ${{ matrix.container }}
        run: |
          if ! command -v cargo > /dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi
      - name: Install dist
        run: ${{ matrix.install_dist.run }}
      # Get the dist-manifest
      - name: Fetch local artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Install dependencies
        run: |
          ${{ matrix.packages_install }}
      - name: Build artifacts
        run: |
          # Actually do builds and make zips and whatnot
          dist build ${{ needs.plan.outputs.tag-flag }} --print=linkage --output-format=json ${{ matrix.dist_args }} > dist-manifest.json
          echo "dist ran successfully"
      # Hamstik addition: artifact-level smoke tests. Runs the binary
      # unpacked from each archive this job just produced (not a cargo
      # build), asserting it starts, reports the release version, and
      # passes an offline diagnostic (see scripts/release_smoke.py). A
      # failure here fails the job, which blocks publishing.
      - name: Smoke test release artifacts
        shell: bash
        run: |
          if python3 -c "import sys" 2>/dev/null; then
            PY=python3
          elif python -c "import sys" 2>/dev/null; then
            PY=python
          else
            echo "no python runtime available for smoke tests" >&2
            exit 1
          fi
          "$PY" scripts/release_smoke.py --manifest dist-manifest.json
      # Hamstik addition: ship man pages with every archive (design docs +
      # manifest derive from the same command tree). Pages land in
      # target/distrib/man/; dist's upload step ships every file there.
      # The binary comes from the archive this job just built (dist owns
      # target/distrib/, not target/release/), extracted by
      # scripts/release_binary.py so the docs are generated from the
      # released executable. bash works on every runner in the matrix
      # (Windows runners resolve `shell: bash` to Git Bash).
      - name: Generate man pages
        shell: bash
        run: |
          BINARY="$(python3 scripts/release_binary.py --manifest dist-manifest.json)"
          python3 scripts/generate_docs.py --binary "$BINARY" --out docs/reference
          mkdir -p target/distrib/man
          cp docs/man/* target/distrib/man/
      - id: cargo-dist
        name: Post-build
        # We force bash here just because github makes it really hard to get values up
        # to "real" actions without writing to env-vars, and writing to env-vars has
        # inconsistent syntax between shell and powershell.
        shell: bash
        run: |
          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          dist print-upload-files-from-manifest --manifest dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # Build and package all the platform-agnostic(ish) things
  build-global-artifacts:
    needs:
      - plan
      - build-local-artifacts
    runs-on: "ubuntu-22.04"
    # Hamstik modification: artifact upload/download scope only.
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Get all the local artifacts for the global tasks to use (for e.g. checksums)
      - name: Fetch local artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: cargo-dist
        shell: bash
        run: |
          dist build ${{ needs.plan.outputs.tag-flag }} --output-format=json "--artifacts=global" > dist-manifest.json
          echo "dist ran successfully"

          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          jq --raw-output ".upload_files[]" dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      # Hamstik addition: CycloneDX SBOMs generated from the committed
      # Cargo.lock for the two released-in-lockstep crates, shipped with
      # each release so downstream consumers can audit the exact dependency
      # set (design/SIGNING.md §SBOM).
      - name: Install Rust toolchain for the SBOM
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked
      - name: Generate SBOMs
        run: |
          cargo cyclonedx --spec-version 1.5 --format json --describe crate \
            --manifest-path crates/hamstik-cli/Cargo.toml
          cargo cyclonedx --spec-version 1.5 --format json --describe crate \
            --manifest-path crates/hamstik-api-client/Cargo.toml
      - name: Collect SBOMs
        run: |
          mkdir -p target/distrib
          mv crates/hamstik-cli/hamstik-cli.cdx.json target/distrib/
          mv crates/hamstik-api-client/hamstik-api-client.cdx.json target/distrib/
          # Keep every uploaded path under target/distrib so the artifact's
          # least-common-ancestor root stays there and files extract flat
          # (a sibling winget/ dir shifted the LCA and nested the paths —
          # found live on the v0.1.1 run).
          mkdir -p winget target/distrib/winget
      # Hamstik addition: generate Winget manifests for stable releases
      # (prereleases are skipped; manifests are only for stable X.Y.Z). The
      # manifests are committed to this repo; a maintainer PRs them to
      # microsoft/winget-pkgs per design/INSTALL.md.
      - name: Generate Winget manifests
        if: ${{ !fromJson(needs.plan.outputs.val).announcement_is_prerelease }}
        run: |
          python3 scripts/generate_winget_manifests.py \
            --version "$(jq --raw-output '.releases[0].app_version' dist-manifest.json)" \
            --tag "$GITHUB_REF_NAME" \
            --sha256sum target/distrib/sha256.sum \
            --date "$(date --utc +%F)" \
            --out target/distrib/winget
      - name: "Upload artifacts"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        # Hamstik note: on prereleases the winget dir is intentionally
        # empty; warn instead of failing the upload.
        with:
          if-no-files-found: warn
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}
            target/distrib/hamstik-cli.cdx.json
            target/distrib/hamstik-api-client.cdx.json
            target/distrib/winget/
  # Determines if we should publish/announce
  host:
    needs:
      - plan
      - build-local-artifacts
      - build-global-artifacts
    # Only run if we're "publishing", and only if plan, local and global didn't fail (skipped is fine)
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.publishing == 'true' && (needs.build-global-artifacts.result == 'skipped' || needs.build-global-artifacts.result == 'success') && (needs.build-local-artifacts.result == 'skipped' || needs.build-local-artifacts.result == 'success') }}
    # Hamstik modification: `contents: write` is required to create the
    # GitHub Release and upload assets; `actions: write` covers the manifest
    # artifact upload below; `id-token: write` (Sigstore OIDC) and
    # `attestations: write` (attestations API) enable the attestations.
    permissions:
      contents: write
      actions: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: "ubuntu-22.04"
    outputs:
      val: ${{ steps.host.outputs.manifest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Fetch artifacts from scratch-storage
      - name: Fetch artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      # Hamstik addition: fail closed on checksum mismatch BEFORE anything
      # is published. dist's aggregated sha256.sum is finalized later, so
      # verify each fetched artifact against its own .sha256 sidecar here;
      # the aggregate is validated by consumers per design/SIGNING.md.
      - name: Verify checksums (fail closed)
        shell: bash
        run: |
          set -euo pipefail
          cd target/distrib
          status=0
          for sumfile in *.sha256; do
            [ -e "$sumfile" ] || continue
            sha256sum -c "$sumfile" || status=1
          done
          if [ "$status" -ne 0 ]; then
            echo "checksum verification FAILED; refusing to publish" >&2
            exit 1
          fi
          echo "all fetched artifacts verified against their .sha256 sidecars"
      # Hamstik addition: generate Sigstore build-provenance attestations
      # binding each downloadable asset (archives, source tarball, SBOMs,
      # installers, formula) to this repository's build, then verify the
      # bundle locally — all BEFORE the release is published. Uses a
      # short-lived Sigstore certificate via the workflow OIDC identity; no
      # keys to custody (design/SIGNING.md §Decision 2).
      - id: attest
        name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            target/distrib/hamstik-*.tar.gz
            target/distrib/hamstik-*.zip
            target/distrib/*installer*.sh
            target/distrib/*installer*.ps1
            target/distrib/*.rb
            target/distrib/source.tar.gz
            target/distrib/*.cdx.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify attestations (fail closed)
        shell: bash
        run: |
          set -euo pipefail
          for file in target/distrib/hamstik-*.tar.gz target/distrib/hamstik-*.zip target/distrib/*installer*.sh target/distrib/*installer*.ps1 target/distrib/*.rb target/distrib/source.tar.gz target/distrib/*.cdx.json; do
            gh attestation verify "$file" --bundle "${{ steps.attest.outputs.bundle-path }}" --repo "$GITHUB_REPOSITORY"
          done
          echo "all attestations verified"
      - id: host
        shell: bash
        run: |
          dist host ${{ needs.plan.outputs.tag-flag }} --steps=upload --steps=release --output-format=json > dist-manifest.json
          echo "artifacts uploaded and released successfully"
          cat dist-manifest.json
          echo "manifest=$(jq -c "." dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          # Overwrite the previous copy
          name: artifacts-dist-manifest
          path: dist-manifest.json
      # Create a GitHub Release while uploading all files to it
      - name: "Download GitHub Artifacts"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - name: Cleanup
        run: |
          # Remove the granular manifests
          rm -f artifacts/*-dist-manifest.json
          # Hamstik note: the winget manifests are fetched with the other
          # artifacts (they live under target/distrib/winget/ in the
          # uploaded artifact), but they are NOT release assets — they are
          # committed to this repo and PR'd to microsoft/winget-pkgs by a
          # maintainer (design/INSTALL.md §Winget).
          rm -rf artifacts/winget
      - name: Create GitHub Release
        env:
          PRERELEASE_FLAG: "${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease && '--prerelease' || '' }}"
          ANNOUNCEMENT_TITLE: "${{ fromJson(steps.host.outputs.manifest).announcement_title }}"
          ANNOUNCEMENT_BODY: "${{ fromJson(steps.host.outputs.manifest).announcement_github_body }}"
          RELEASE_COMMIT: "${{ github.sha }}"
        run: |
          # Write and read notes from a file to avoid quoting breaking things
          echo "$ANNOUNCEMENT_BODY" > $RUNNER_TEMP/notes.txt

          gh release create "${{ needs.plan.outputs.tag }}" --target "$RELEASE_COMMIT" $PRERELEASE_FLAG --title "$ANNOUNCEMENT_TITLE" --notes-file "$RUNNER_TEMP/notes.txt" artifacts/*

  publish-homebrew-formula:
    needs:
      - plan
      - host
    runs-on: "ubuntu-22.04"
    # Hamstik modification: publishes the dist-generated Homebrew formula
    # to blackboardstudios/homebrew-hamstik per stable release. Cross-repo
    # push needs a fine-grained PAT with Contents:write on the tap repo
    # only, stored as the HOMEBREW_TAP_TOKEN secret (design/INSTALL.md).
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PLAN: ${{ needs.plan.outputs.val }}
      GITHUB_USER: "hamstik-release-bot"
      GITHUB_EMAIL: "noreply@blackboardstudios.com"
    if: ${{ (!fromJson(needs.plan.outputs.val).announcement_is_prerelease || fromJson(needs.plan.outputs.val).publish_prereleases) && needs.plan.outputs.homebrew_tap_token_present == 'true' }}
    steps:
      # Hamstik note: the tap push needs a dedicated fine-grained PAT
      # (Contents:write on the tap repo only) stored as HOMEBREW_TAP_TOKEN;
      # until it is provisioned the job skips with a loud warning instead of
      # failing the whole release (design/INSTALL.md §tap token).
      - name: Require tap token
        if: ${{ needs.plan.outputs.homebrew_tap_token_present != 'true' }}
        run: |
          echo "HOMEBREW_TAP_TOKEN is not configured; skipping Homebrew tap publish." | tee "$GITHUB_STEP_SUMMARY"
          echo "Provision it per design/INSTALL.md to publish the formula automatically." | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ needs.plan.outputs.homebrew_tap_token_present == 'true' }}
        with:
          persist-credentials: true
          repository: "blackboardstudios/homebrew-hamstik"
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      # So we have access to the formula
      - name: Fetch homebrew formulae
        if: ${{ needs.plan.outputs.homebrew_tap_token_present == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: artifacts-*
          path: Formula/
          merge-multiple: true
      # Hamstik fix: uploaded artifacts keep their target/distrib/... layout
      # relative to the artifact root, so the formula lands nested; hoist
      # every .rb to Formula/ before the commit step runs.
      - name: Hoist formulae to Formula/
        if: ${{ needs.plan.outputs.homebrew_tap_token_present == 'true' }}
        run: |
          set -euo pipefail
          find Formula -name "*.rb" -not -path "Formula/*.rb" -exec mv -t Formula/ {} +
          ls Formula/*.rb
      # This is extra complex because you can make your Formula name not match your app name
      # so we need to find releases with a *.rb file, and publish with that filename.
      - name: Commit formula files
        if: ${{ needs.plan.outputs.homebrew_tap_token_present == 'true' }}
        run: |
          git config --global user.name "${GITHUB_USER}"
          git config --global user.email "${GITHUB_EMAIL}"

          for release in $(echo "$PLAN" | jq --compact-output '.releases[] | select([.artifacts[] | endswith(".rb")] | any)'); do
            filename=$(echo "$release" | jq '.artifacts[] | select(endswith(".rb"))' --raw-output)
            name=$(echo "$filename" | sed "s/\.rb$//")
            version=$(echo "$release" | jq .app_version --raw-output)

            export PATH="/home/linuxbrew/.linuxbrew/bin:$PATH"
            brew update
            # We avoid reformatting user-provided data such as the app description and homepage.
            brew style --except-cops FormulaAudit/Homepage,FormulaAudit/Desc,FormulaAuditStrict --fix "Formula/${filename}" || true

            # Skip when the tap already has this exact version (e.g. a
            # re-run): an empty commit would fail the release.
            if git diff --quiet -- Formula/"${filename}"; then
              echo "Formula/${filename} unchanged; nothing to commit"
              continue
            fi
            git add "Formula/${filename}"
            git commit -m "${name} ${version}"
          done
          git push

  announce:
    needs:
      - plan
      - host
      - publish-homebrew-formula
    # use "always() && ..." to allow us to wait for all publish jobs while
    # still allowing individual publish jobs to skip themselves (for prereleases).
    # "host" however must run to completion, no skipping allowed!
    if: ${{ always() && needs.host.result == 'success' && (needs.publish-homebrew-formula.result == 'skipped' || needs.publish-homebrew-formula.result == 'success') }}
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
