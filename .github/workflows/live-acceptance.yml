# Live Public API v1 acceptance (CLI-6), manual and secrets-gated.
#
# This workflow never runs on push or schedule: it is `workflow_dispatch` only,
# and it skips unless the repository explicitly opts in. Configure the test
# deployment through repository *secrets* (never in the repo or the logs):
#
#   Secrets (repository secrets, "Actions secrets and variables"):
#     LIVE_ACCEPTANCE_TOKEN            dedicated test PAT (write scopes)
#     LIVE_ACCEPTANCE_HOST             test deployment origin
#     LIVE_ACCEPTANCE_ORG              dedicated test Organization slug
#     LIVE_ACCEPTANCE_PROJECT          dedicated test Project key
#
#   Variables (repository variables, the opt-in switch):
#     LIVE_ACCEPTANCE_ENABLED          set to "true" to allow dispatches
#
# The job passes `--test-threads=1` and cleans up what it created (see
# crates/hamstik-cli/tests/live_acceptance/README.md). When the opt-in
# variables/secrets are absent, the job exits successfully with a notice.

name: Live acceptance

on:
  workflow_dispatch:
    inputs:
      mutations:
        description: Run the mutation lifecycle too (writes on the test Project)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live:
    name: Live Public API v1 acceptance (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Opt-in switch + all four credentials must be configured; otherwise skip.
    if: >-
      vars.LIVE_ACCEPTANCE_ENABLED == 'true' &&
      secrets.LIVE_ACCEPTANCE_TOKEN != '' &&
      secrets.LIVE_ACCEPTANCE_HOST != '' &&
      secrets.LIVE_ACCEPTANCE_ORG != '' &&
      secrets.LIVE_ACCEPTANCE_PROJECT != ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Build the CLI
        run: cargo build --release

      - name: Run the live acceptance suite
        env:
          HAMSTIK_TOKEN: ${{ secrets.LIVE_ACCEPTANCE_TOKEN }}
          HAMSTIK_HOST: ${{ secrets.LIVE_ACCEPTANCE_HOST }}
          HAMSTIK_ACCEPTANCE_ORG: ${{ secrets.LIVE_ACCEPTANCE_ORG }}
          HAMSTIK_ACCEPTANCE_PROJECT: ${{ secrets.LIVE_ACCEPTANCE_PROJECT }}
        run: |
          if [ "${{ inputs.mutations }}" = "true" ]; then
            export HAMSTIK_ACCEPTANCE_MUTATIONS=true
          fi
          cargo test --release --test live_acceptance \
            -- --test-threads=1 --ignored
