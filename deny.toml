# cargo-deny configuration (CI gate: `check advisories licenses sources`).

[advisories]
version = 2
# Known advisories fail CI. yanked crates are refused too.
yanked = "deny"

[licenses]
version = 2
# The workspace is Apache-2.0; dependencies must be compatible with
# distributing this CLI under Apache-2.0. MPL-2.0 is file-level copyleft that
# is Apache-2.0 compatible per the MPL's own compatibility guidance; Zlib is a
# permissive license used by foldhash through the embedded jq implementation.
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "Zlib",
]
# Trust the Rust ecosystem confidence store so copyleft-ambiguous crates with
# unlisted licenses are caught loudly instead of silently allowed.
confidence-threshold = 0.8

[[licenses.clarify]]
crate = "ring"
expression = "OpenSSL OR ISC"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[sources]
# Dependencies must come from crates.io or the well-known sparse registry —
# a private git dependency could smuggle unaudited code into a public binary.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
