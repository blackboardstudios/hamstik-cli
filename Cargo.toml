[workspace]
members = [
    "crates/hamstik-cli",
    "crates/hamstik-api-client",
    # Release tooling (CLI-27): fail-closed tag/version/changelog gate run by
    # .github/workflows/release.yml; see design/RELEASE.md.
    "crates/release-gate",
]
resolver = "2"

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/blackboardstudios/hamstik-cli"
homepage = "https://hamstik.com"
authors = ["Blackboard Studios"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
# Tests legitimately unwrap to assert on expected successes, so the denial is
# scoped per-crate below rather than workspace-wide.
unwrap_used = "warn"
expect_used = "warn"

[workspace.dependencies]
# Shared runtime / serialization
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
secrecy = { version = "0.10", features = ["serde"] }

# API client
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "json", "multipart"] }
bytes = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
httpdate = "1"
getrandom = "0.4"
rustls = { version = "0.23", default-features = false }

# CLI
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
toml = "1.1"
directories = "6"
keyring = "3"
rpassword = "7"

# Testing
wiremock = "0.6"
tempfile = "3"
assert_cmd = "2"
predicates = "3"
pretty_assertions = "1"
zip = "2"

[profile.release]
lto = "thin"

# The profile that 'dist' will build with. Release already sets lto = "thin";
# dist builds should match the plain release profile exactly.
[profile.dist]
inherits = "release"
