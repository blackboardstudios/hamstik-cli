[workspace]
members = [
    "crates/hamstik-cli",
    "crates/hamstik-api-client",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/bbs-steven/hamstik-cli"
homepage = "https://hamstik.com"
authors = ["Blackboard Studios"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
# Tests legitimately unwrap to assert on expected successes, so the denial is
# scoped per-crate below rather than workspace-wide.
unwrap_used = "warn"
expect_used = "warn"

[workspace.dependencies]
# Shared runtime / serialization
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
secrecy = { version = "0.10", features = ["serde"] }

# API client
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "json", "multipart"] }
bytes = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
httpdate = "1"

# CLI
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
toml = "1.1"
directories = "6"
keyring = "3"
rpassword = "7"

# Testing
wiremock = "0.6"
tempfile = "3"
assert_cmd = "2"
predicates = "3"
pretty_assertions = "1"

[profile.release]
lto = "thin"
