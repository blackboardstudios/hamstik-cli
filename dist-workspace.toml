[workspace]
members = ["cargo:."]

# Config for 'dist' (the cargo-dist release tool; see design/RELEASE.md).
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax).
# Pinned: release CI fetches exactly this version.
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app (CLI-29): a curl-able POSIX shell
# installer, a Windows PowerShell installer, and a Homebrew formula (SPEC
# §68–§70 decisions in design/INSTALL.md). Winget manifests are maintained
# separately (generated per release, manually PR'd to microsoft/winget-pkgs).
installers = ["shell", "powershell", "homebrew"]
# The GitHub repository to publish the Homebrew formula to per release
# (conventional `homebrew-` prefix). Users install with:
#   brew tap blackboardstudios/hamstik https://github.com/blackboardstudios/homebrew-hamstik
#   brew install blackboardstudios/hamstik/hamstik
tap = "blackboardstudios/homebrew-hamstik"
# Publish the Homebrew formula to the tap during the release pipeline's
# publish phase. The builtin publish job checks out the tap with
# `secrets.HOMEBREW_TAP_TOKEN` — a fine-grained PAT with Contents:write on
# the tap repo only (cross-repo pushes are outside the default GITHUB_TOKEN's
# scope; see design/INSTALL.md §Homebrew).
publish-jobs = ["homebrew"]
# Target platforms to build apps for (Rust target-triple syntax). This is the
# documented supported release matrix (design/RELEASE.md); aarch64-pc-windows-msvc
# and the musl targets are deliberately excluded (rationale in design/RELEASE.md).
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Where to host releases
hosting = "github"
# Archive formats (SPEC §68–§70): .tar.gz for macOS/Linux, .zip for Windows.
unix-archive = ".tar.gz"
windows-archive = ".zip"
# Pull requests exercise `dist plan` only (config validation) and never build
# or publish anything.
pr-run-mode = "plan"
# release.yml carries deliberate, locally maintained modifications on top of
# dist's generated output (release gate, artifact smoke tests, least-privilege
# permissions, narrowed tag trigger, SBOM/attestations, Homebrew publish —
# each marked in the workflow file). This tells dist to stop freshness-checking
# that file. To regenerate after a cargo-dist upgrade: temporarily remove this
# line, run `dist generate`, re-apply the marked modifications, then restore
# the line (see the maintenance note in .github/workflows/release.yml and
# design/RELEASE.md).
allow-dirty = ["ci"]

# Third-party GitHub Actions pinned to immutable commits (repository policy;
# SHA of the exact version dist 0.32.0 would otherwise reference by tag).
[dist.github-action-commits]
"actions/checkout" = "3d3c42e5aac5ba805825da76410c181273ba90b1"
"actions/upload-artifact" = "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a"
"actions/download-artifact" = "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c"
